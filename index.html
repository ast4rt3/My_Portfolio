<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Heras Lawrence</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body class="dark-mode">
    <header class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">PORTFOLIO<span>.</span></a>
            <nav class="nav-links">
                <a href="#home">Home</a>
                <a href="#projects">Projects</a>
                <a href="#skills">Skills</a>
                <a href="#contact">Contact</a>
                <button id="theme-toggle" class="theme-btn">
                    <i class="fas fa-sun"></i>
                </button>
            </nav>
            <div class="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </header>

    <main>
        <section id="home" class="hero">
            <div class="hero-content">
                <h1 class="reveal">Hello, I'm <span class="gradient-text">Developer</span></h1>
                <p class="reveal delay-1">Crafting digital experiences with precision and passion.</p>
                <div class="hero-btns reveal delay-2">
                    <a href="#projects" class="btn primary">View My Work</a>
                    <a href="#contact" class="btn secondary">Get In Touch</a>
                </div>
            </div>
            <div class="hero-bg-overlay"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
